<!doctype html>
<html lang="hi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="एनपीसी प्रमाण-पत्र" />
    <title>Certified NPC</title>
    <style>
      :root {
        color-scheme: dark;
        background: #000;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        min-width: 100%;
        min-height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
        overscroll-behavior: none;
      }

      body {
        position: fixed;
        inset: 0;
      }

      .video-stage {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        background: #000;
      }

      .background-video {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        max-width: none;
        object-fit: cover;
        object-position: center;
        border: 0;
        background: #000;
        pointer-events: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }

      .certification-button {
        position: fixed;
        z-index: 1;
        top: 50%;
        left: 50%;
        width: auto;
        max-width: calc(100vw - 32px);
        margin: 0;
        padding: 8px 12px;
        transform: translate(-50%, -50%);
        border: 0;
        background: transparent;
        color: #fff;
        font-family: "Noto Sans Devanagari", "Kohinoor Devanagari", Mangal, sans-serif;
        font-size: 18px;
        font-weight: 500;
        line-height: 1.4;
        text-align: center;
        text-decoration-line: underline;
        text-decoration-thickness: 1px;
        text-underline-offset: 5px;
        text-wrap: balance;
        cursor: default;
        -webkit-tap-highlight-color: transparent;
      }

      .background-video::-webkit-media-controls,
      .background-video::-webkit-media-controls-enclosure,
      .background-video::-webkit-media-controls-panel,
      .background-video::-webkit-media-controls-start-playback-button {
        display: none !important;
        opacity: 0 !important;
      }

      @media (max-width: 767px) {
        .certification-button {
          width: calc(100vw - 32px);
          font-size: 16px;
        }
      }
    </style>
  </head>
  <body>
    <main class="video-stage">
      <video
        class="background-video"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
        disablepictureinpicture
        disableremoteplayback
        aria-hidden="true"
        tabindex="-1"
      >
        <source
          src="./assets/background-mobile.mp4"
          type="video/mp4"
          media="(max-aspect-ratio: 3/4)"
        />
        <source src="./assets/background-desktop.mp4" type="video/mp4" />
      </video>

      <button class="certification-button" type="button">
        एनपीसी प्रमाण-पत्र पाइए, दुख-दर्द से छुटकारा पाइए
      </button>
    </main>

    <script>
      (() => {
        const video = document.querySelector(".background-video");
        if (!video) return;

        const play = () => {
          video.muted = true;
          video.defaultMuted = true;
          video.loop = true;
          video.playsInline = true;
          video.setAttribute("muted", "");
          video.setAttribute("playsinline", "");
          video.play().catch(() => {});
        };

        play();
        window.addEventListener("pageshow", play);
        document.addEventListener("visibilitychange", () => {
          if (!document.hidden) play();
        });
      })();
    </script>
  </body>
</html>
