<!doctype html>
<html lang="hi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050704" />
    <meta
      name="description"
      content="एनपीसी प्रमाण-पत्र पाइए, दुख-दर्द से छुटकारा पाइए।"
    />
    <meta property="og:title" content="Certified NPC" />
    <meta
      property="og:description"
      content="आठ प्रश्न। दो उत्तर। एक प्रमाण-पत्र।"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://certifiednpc.site/" />
    <meta property="og:image" content="https://certifiednpc.site/assets/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="675" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://certifiednpc.site/assets/og.png" />
    <title>Certified NPC</title>
    <link rel="preload" href="./assets/quiz-desk.jpg" as="image" />
    <link rel="preload" href="./assets/officer-jumpscare.jpg" as="image" />
    <link rel="preload" href="./assets/question-sheet.jpg" as="image" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <section class="video-stage" aria-label="एनपीसी प्रमाण-पत्र">
        <video
          class="background-video"
          autoplay
          muted
          loop
          playsinline
          preload="auto"
          disablepictureinpicture
          disableremoteplayback
          aria-hidden="true"
          tabindex="-1"
        >
          <source
            src="./assets/background-mobile.mp4"
            type="video/mp4"
            media="(max-aspect-ratio: 3/4)"
          />
          <source src="./assets/background-desktop.mp4" type="video/mp4" />
        </video>

        <button class="certification-button" type="button">
          एनपीसी प्रमाण-पत्र पाइए, दुख-दर्द से छुटकारा पाइए
        </button>
      </section>

      <section class="quiz-stage" aria-label="एनपीसी परीक्षा" aria-hidden="true">
        <div class="vhs-damage" aria-hidden="true"></div>

        <div class="roach-layer" aria-hidden="true">
          <img class="roach roach-one" src="./assets/cockroach.png" alt="" />
          <img class="roach roach-two" src="./assets/cockroach.png" alt="" />
          <img class="roach roach-three" src="./assets/cockroach.png" alt="" />
        </div>

        <article class="question-paper" aria-live="polite">
          <div class="question-portrait" role="img"></div>
          <p class="question-word">समर्थन?</p>
        </article>

        <div class="answer-controls" aria-label="अपना उत्तर चुनें">
          <button class="answer-button answer-yes" type="button" data-answer="yes">
            हाँ
          </button>
          <button class="answer-button answer-no" type="button" data-answer="no">
            नहीं
          </button>
        </div>

        <div class="officer-jumpscare" aria-hidden="true"></div>
        <div class="impact-flash" aria-hidden="true"></div>

        <section class="result-screen" aria-hidden="true">
          <div class="certificate-card">
            <p class="certificate-kicker">भारत गणराज्य के काल्पनिक अभिलेख हेतु</p>
            <h1>एनपीसी प्रमाण-पत्र</h1>
            <div class="certificate-seal" aria-hidden="true">NPC</div>
            <p class="certificate-copy">
              यह प्रमाणित किया जाता है कि धारक ने आठ प्रश्नों की
              आज्ञाकारिता परीक्षा पूरी कर ली है।
            </p>
            <p class="certificate-score"></p>
            <p class="certificate-serial"></p>
          </div>

          <button class="download-button" type="button">
            प्रमाण-पत्र डाउनलोड करें
          </button>
          <button class="restart-button" type="button">पुनः परीक्षा दें</button>
        </section>
      </section>
    </main>

    <script src="./app.js" defer></script>
  </body>
</html>
